# /etc/turnserver.conf — coturn for the FamilyCall call server on the shared
# zbackroom box. Placeholders are filled in by setup-zbackroom.sh.
# (deploy/turnserver.conf is the dedicated-VPS version: full relay port range.)
listening-port=3478
tls-listening-port=5349
# The box is behind AWS 1:1 NAT: PUBLIC/PRIVATE.
external-ip=__EXTERNAL_IP__
realm=call.zbackroom.com
server-name=call.zbackroom.com
fingerprint
# Time-limited credentials generated by the Node server (TURN_SECRET in .env).
use-auth-secret
static-auth-secret=__TURN_SECRET__
# Relay port range. Deliberately narrow (800 ports; each relayed phone uses
# one) because every port in it has to be opened in the AWS security group,
# on a box that also serves billing and login. Widen it if calls ever run out
# of relay ports.
min-port=49152
max-port=49951
# TLS for turns: (copied from the Let's Encrypt cert by the certbot deploy hook).
cert=/etc/coturn/cert.pem
pkey=/etc/coturn/key.pem
# Hardening
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
# Keep relayed media between the two phones only; this is not a public relay.
total-quota=20
user-quota=8
log-file=/var/log/turnserver.log
simple-log
