# /etc/turnserver.conf — coturn for stt-videocall. Placeholders are filled in by setup-vps.sh.
listening-port=3478
tls-listening-port=5349
# Public IP of this VPS. If the VPS is behind 1:1 NAT (most clouds), use "external-ip=PUBLIC/PRIVATE".
external-ip=__PUBLIC_IP__
realm=__DOMAIN__
server-name=__DOMAIN__
fingerprint
# Time-limited credentials generated by the Node server (TURN_SECRET in .env).
use-auth-secret
static-auth-secret=__TURN_SECRET__
# Relay port range (open it in the firewall, UDP).
min-port=49152
max-port=65535
# TLS for turns: (cert managed by Caddy, copied by deploy/copy-turn-cert.sh)
cert=/etc/coturn/cert.pem
pkey=/etc/coturn/key.pem
# Hardening
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
# Keep relayed media between the two phones only; this is not a public relay.
total-quota=20
user-quota=8
log-file=/var/log/turnserver.log
simple-log
