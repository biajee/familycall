server {
    listen 80;
    listen [::]:80;

    server_name call.zbackroom.com;

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        # The phones hold one WebSocket (/ws) open for the whole call:
        # signaling, caption text, and their own mic audio as binary frames.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A call can outlast nginx's 60s default idle timeout between messages
        # (the server pings every 20s, but don't lean on that alone).
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
